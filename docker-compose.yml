services:
  api:
    build: .
    deploy:
      replicas: 2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # how stale GET /users/{id} may be. Raise it to watch staleness last longer.
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    # redis is deliberately not in depends_on: the API must start and answer
    # from Postgres with the cache down, so it cannot wait for it either.
    depends_on:
      db:
        # plain depends_on waits for the container to start, not for Postgres to
        # accept connections. On a fresh volume initdb takes seconds and the API
        # would connect too early.
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  migrate:
    build: .
    # one-shot: applies pending migrations, then exits. Running them here and
    # not in the API's startup means replicas never race to change the schema,
    # and no API starts against a schema older than its code expects.
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  load-balancer:
    image: haproxy:3.0-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    # a cache, not a database: no snapshots, no append-only file, no volume.
    # A restart starts empty and every read is a MISS until it warms up again.
    # maxmemory + allkeys-lru: when full, drop the least recently used copy
    # rather than refuse writes. Postgres still has every user.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
