services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db

  # not wired into app/main.py yet — the API still reads/writes its in-memory
  # dict. This just stands the datastore component up so it exists as a
  # container, matching the HLD's 3rd box, ahead of the persistence session.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
